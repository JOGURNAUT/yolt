services:
  postgres:
    image: postgres:17
    # Come back up after Docker or the machine restarts (stopped only by `pnpm db:down`).
    restart: unless-stopped
    environment:
      POSTGRES_USER: yolt
      POSTGRES_PASSWORD: yolt
      POSTGRES_DB: yolt
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yolt -d yolt"]
      interval: 2s
      timeout: 3s
      retries: 20
  # S3-compatible stand-in for Cloudflare R2 (MinIO no longer publishes images).
  media:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: yolt
      RUSTFS_SECRET_KEY: yolt-dev-secret
    ports:
      - "9000:9000"
    volumes:
      - mediadata:/data
volumes:
  pgdata:
  mediadata:
