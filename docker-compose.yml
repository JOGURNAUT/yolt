services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: yolt
      POSTGRES_PASSWORD: yolt
      POSTGRES_DB: yolt
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yolt -d yolt"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
