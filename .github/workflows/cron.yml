name: Scheduled jobs

# Vercel's free plan only runs crons daily, so staging's jobs run from here.
# Inactive until the repository has a CRON_BASE_URL variable and a CRON_SECRET secret.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    if: ${{ vars.CRON_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ vars.CRON_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Expire reservations
        run: |
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/expire-holds"
      - name: Open drops and queue reminders
        run: |
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/drops"
      - name: Close delivered orders
        run: |
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/close-delivered"
