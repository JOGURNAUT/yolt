name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    # A broken workflow file only shows up after merge otherwise (this caught cron.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yolt
          POSTGRES_PASSWORD: yolt
          POSTGRES_DB: yolt
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U yolt -d yolt"
          --health-interval 2s --health-timeout 3s --health-retries 20
      media:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: yolt
          RUSTFS_SECRET_KEY: yolt-dev-secret
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgres://yolt:yolt@localhost:5433/yolt
      TEST_DATABASE_URL: postgres://yolt:yolt@localhost:5433/yolt_test
      MEDIA_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=yolt psql -h localhost -p 5433 -U yolt -d yolt -c "CREATE DATABASE yolt_test"
      - name: Create media bucket
        run: |
          for _ in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && break; sleep 1; done
          pnpm media:setup
      - run: pnpm typecheck
      - run: pnpm --filter @yolt/web lint
      - run: pnpm test
      - name: Check migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run pnpm db:generate and commit it."
            git status --porcelain packages/db/migrations
            exit 1
          fi
      - run: pnpm --filter @yolt/web build
