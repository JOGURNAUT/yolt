name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yolt
          POSTGRES_PASSWORD: yolt
          POSTGRES_DB: yolt
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U yolt -d yolt"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://yolt:yolt@localhost:5433/yolt
      TEST_DATABASE_URL: postgres://yolt:yolt@localhost:5433/yolt_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=yolt psql -h localhost -p 5433 -U yolt -d yolt -c "CREATE DATABASE yolt_test"
      - run: pnpm typecheck
      - run: pnpm --filter @yolt/web lint
      - run: pnpm test
      - name: Check migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run pnpm db:generate and commit it."
            git status --porcelain packages/db/migrations
            exit 1
          fi
      - run: pnpm --filter @yolt/web build
